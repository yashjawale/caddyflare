name: Keepalive

on:
  schedule:
    - cron: '0 0 1 * *' # Monthly - prevents scheduled workflows from being disabled after 60 days of inactivity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keepalive commit
        run: |
          # Only create an empty commit if there has been no activity in the last 50 days
          # GitHub disables scheduled workflows after 60 days of inactivity
          LAST_COMMIT=$(git log -1 --format=%ct)
          THRESHOLD=$(date -d '50 days ago' +%s)
          if [ "$LAST_COMMIT" -lt "$THRESHOLD" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive - prevent workflow disable"
            git push
          else
            echo "Repository is active, no keepalive commit needed"
          fi
